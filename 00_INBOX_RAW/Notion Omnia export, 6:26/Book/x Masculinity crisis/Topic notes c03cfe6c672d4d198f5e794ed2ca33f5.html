ents and sneaked down to Havana for a brief getaway. You might be familiar with this uncanny sensation of kidlessness, as if you are getting away with something reckless and potentially illegal.</div></div><div class="bookmark-href"><img src="https://static01.nyt.com/favicon.ico" class="icon bookmark-icon"/>https://www.nytimes.com/2018/03/12/travel/havana-cuba.html?rref=collection%2Fsectioncollection%2Ftravel</div></div><img src="https://static01.nyt.com/images/2018/03/18/travel/18cuba2/merlin_102835471_1d88add3-ed44-416f-8e16-5f52dbf1ed17-superJumbo.jpg" class="bookmark-image"/></a></figure></div><div style="display:contents" dir="ltr"><figure id="df1a10aa-76f1-43de-9bce-1e5f7b9d8e59" class="link-to-page"><a href="Topic%20notes/Masculinity%20crisis%20The%20rise%20of%20lonely,%20single%20men%20df1a10aa76f143de9bce1e5f7b9d8e59.html">Masculinity crisis: The rise of lonely, single men</a></figure></div><div style="display:contents" dir="ltr"><figure id="7d927687-74cb-45de-b225-930059715895" class="link-to-page"><a href="Topic%20notes/Feminism%20pros%20and%20cons%207d92768774cb45deb225930059715895.html">Feminism pros and cons</a></figure></div><div style="display:contents" dir="ltr"><figure id="0eaed3c6-ae6e-40d2-bc7c-3d28ea116534" class="link-to-page"><a href="Topic%20notes/Sexual%20selection,%20mate%20choice%20and%20female%20mate%20samp%200eaed3c6ae6e40d2bc7c3d28ea116534.html">Sexual selection, mate choice and female mate sampling and paradox of choice</a></figure></div><div style="display:contents" dir="ltr"><figure id="828cdd2f-d5d1-4cc6-98b0-fec99a5880ea" class="link-to-page"><a href="Topic%20notes/Influence%20of%20tech,%20SM,%20dating%20apps%20on%20female%20mate%20%20828cdd2fd5d14cc698b0fec99a5880ea.html">Influence of tech, SM, dating apps on female mate selection</a></figure></div><div style="display:contents" dir="ltr"><figure id="191b006b-813b-4179-a862-64cad077e0b6" class="link-to-page"><a href="Topic%20notes/Contraception%20and%20feminist%20movement%20and%20i
